<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TiernanMusicNext - UI Preview (HTML mock)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>21:45</span><span>5G  4G  50%</span></div>
  <header class="topbar"><h1>Home</h1><button aria-label="search">&#128269;</button></header>
  <main class="content">
    <section>
      <h2>Daily Mix</h2>
      <div class="empty">No daily mix yet (available after sign in)</div>
    </section>
    <section>
      <h2>Recommended Playlists</h2>
      <div class="cards" id="playlists"></div>
    </section>
    <section>
      <h2>Charts</h2>
      <div class="charts" id="charts"></div>
    </section>
  </main>
  <div class="mini">
    <div class="mini-cover"></div>
    <div class="mini-text"><b>Unknown song</b><small>Unknown artist</small></div>
    <button aria-label="play">&#9654;</button>
    <button aria-label="next">&#9197;</button>
  </div>
  <nav class="navbar">
    <button class="nav active"><span class="ico">&#8962;</span><span>Home</span></button>
    <button class="nav"><span class="ico">&#128269;</span><span>Search</span></button>
    <button class="nav"><span class="ico">&#9835;</span><span>Playlist</span></button>
    <button class="nav"><span class="ico">&#127911;</span><span>Library</span></button>
    <button class="nav"><span class="ico">&#9881;</span><span>Settings</span></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>

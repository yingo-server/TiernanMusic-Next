name: tiernan_music_next
description: "TiernanMusic-Next: six-layer rewrite. Offline-first Kugou client on Flutter M3 + Riverpod."
publish_to: "none"
version: 26.11.10+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4
  video_player: ^2.9.2
  # YKG 链接登录：算法一律用成熟库（AES-256-GCM / PBKDF2-HMAC-SHA256 /
  # HMAC / SHA-256），自研代码只负责报文封装与流程，见
  # docs/YKG_LINK_CRYPTO_DESIGN.md。
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  isar_generator: ^3.1.0+1

flutter:
  generate: true
  uses-material-design: true

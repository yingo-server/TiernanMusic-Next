name: tiernan_music_next
description: "TiernanMusic-Next: six-layer rewrite. Offline-first Kugou client on Flutter M3 + Riverpod."
publish_to: "none"
version: 26.11.10+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4
  video_player: ^2.9.2
  # YKG 链接登录：算法一律用成熟库（AES-256-GCM / PBKDF2-HMAC-SHA256 /
  # HMAC / SHA-256），自研代码只负责报文封装与流程，见
  # docs/YKG_LINK_CRYPTO_DESIGN.md。
  cryptography: ^2.7.0
  # ── UI 重写（森林翡翠设计语言）──
  # GetWidget：官方 Material 3 之外的补充包（Obx/GetBuilder/GetView/
  # GetSnackbar/GetDialog/GetBottomSheet/GetMaterialApp）。
  # 契约：UI 层只用官方 M3 + GetWidget 现成能力，不手写任何控件（只写色彩）。
  get: ^4.7.3
  # 桌面自定义标题栏（Windows/Linux 原生窗口句柄 + 置透明）。
  bitsdojo_window: ^0.1.6
  # 窗口尺寸/最小尺寸/最大化（与 bitsdojo_window 配合，职责分离）。
  window_manager: ^0.4.3
  # 跨平台文件选择（桌面/移动统一入口，走能力网关）。
  file_selector: ^1.0.3
  # 注意：desktop_drop / screen_retriever 有 Android 端实现，会在 APK 构建时
  # 触发 AAR 元数据冲突（android-33 vs androidx 34+）。桌面拖拽/多屏改用
  # Flutter 官方 DragTarget + MediaQuery 实现（零原生依赖），不引入这两个包。
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  isar_generator: ^3.1.0+1

flutter:
  generate: true
  uses-material-design: true

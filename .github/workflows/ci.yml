# CI 工作流 · TiernanMusic-Next
# 标准：
# - 版本号由 CI 按东八区时间生成：YY.MM.DD.NN（日期.两位序号，按当日已有 tag 递增）
# - 支持参数发布 release / 不发布；指定 debug；透传更新日志到 release body 和 /changed/<版本>.md
# - 报错不妥协：尽量跑完全程，一次暴露全部错误（每步 continue-on-error + 末尾汇总判定）
# - 构建与测试全部在 CI 完成（本地 arm64 无 Flutter）
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'publish release'
        type: boolean
        default: false
      debug:
        description: 'debug build (integrity bypass allowed)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: compute version (Asia/Shanghai)
        id: version
        run: |
          DATE=$(TZ=Asia/Shanghai date +%y.%m.%d)
          # 当日已有 tag 的最大序号 +1（两位，01 起）；无则 01
          LAST=$(git tag -l "v${DATE}.*" | sed "s/^v${DATE}\.//" | sort -n | tail -1)
          if [ -z "$LAST" ]; then SEQ=1; else SEQ=$((10#$LAST + 1)); fi
          VER="${DATE}.$(printf '%02d' $SEQ)"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "computed version: $VER (tz=Asia/Shanghai)"
      - name: pub get
        run: flutter pub get
      - name: smoke check (static compliance)
        if: always()
        run: dart run tool/smoke_check.dart 2>&1 | tee /tmp/smoke.log
        continue-on-error: true
      - name: feature reachability (pure Dart)
        if: always()
        run: dart run tool/feature_reachability_test.dart 2>&1 | tee /tmp/reach.log
        continue-on-error: true
      - name: boot contract (pure Dart)
        if: always()
        run: dart run tool/boot_contract_test.dart 2>&1 | tee /tmp/boot_contract.log
        continue-on-error: true
      - name: download contract (pure Dart)
        if: always()
        run: dart run tool/download_contract_test.dart 2>&1 | tee /tmp/download_contract.log
        continue-on-error: true
      - name: generate isar code
        if: always()
        run: dart run build_runner build --delete-conflicting-outputs
      - name: dart syntax (fast gate, no SDK deps)
        id: syntax
        if: always()
        run: dart format --output=none lib tool 2>&1 | tee /tmp/syntax.log
        continue-on-error: true
      - name: analyze
        id: analyze
        if: always()
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee /tmp/analyze.log
        continue-on-error: true
      - name: field truth (pure Dart anchors)
        if: always()
        run: dart run tool/field_truth_test.dart 2>&1 | tee /tmp/field_truth.log
        continue-on-error: true
      - name: test
        id: test
        if: always()
        run: flutter test 2>&1 | tee /tmp/test.log
        continue-on-error: true
      - name: layer audit
        if: always()
        run: python3 tool/layer_audit.py 2>&1 | tee /tmp/layer.log
        continue-on-error: true
      - name: analyze gate (project-type errors)
        if: always()
        run: python3 tool/analyze_gate.py 2>&1 | tee /tmp/analyze_gate.log
        continue-on-error: true
      - name: verdict
        id: verdict
        if: always()
        run: |
          V=ok
          # 语法闸：dart format 解析失败即语法错（不依赖 flutter SDK）
          test "${{ steps.syntax.outcome }}" = success || V=fail
          grep -q "Could not format" /tmp/syntax.log && V=fail
          # analyze 必须真通过：退出码经 pipefail 传递；此前 continue-on-error
          # 掩盖了 analyze 崩溃与「无问题」无法区分的漏洞（批08 发现）。
          test "${{ steps.analyze.outcome }}" = success || V=fail
          grep -qE "error •|^\s*error" /tmp/analyze.log && V=fail
          # 批05-A: warning 仅计数可见，不参与 fail 门禁
          W=$(grep -cE "warning •|^\s*warning" /tmp/analyze.log || true)
          echo "analyzer warnings: $W"
          echo "warnings=$W" >> $GITHUB_OUTPUT
          grep -qE "All tests (passed|passed!)|tests passed" /tmp/test.log || V=fail
          grep -q "VIOLATION" /tmp/layer.log && V=fail
          grep -q "REAL-ERRORS" /tmp/analyze_gate.log && V=fail
          grep -q "analyze_gate ok" /tmp/analyze_gate.log || V=fail
          grep -q "^VIOLATION\|^FAIL" /tmp/smoke.log && V=fail
          grep -q "FIELD-TRUTH-OK" /tmp/field_truth.log || V=fail
          grep -q "FIELD-TRUTH-FAIL" /tmp/field_truth.log && V=fail
          grep -q "FEATURE-REACHABILITY-OK" /tmp/reach.log || V=fail
          grep -q "FEATURE-REACHABILITY-FAIL" /tmp/reach.log && V=fail
          grep -q "boot contract self-check" /tmp/boot_contract.log || V=fail
          grep -q "0 failed" /tmp/boot_contract.log || V=fail
          grep -q "download contract self-check" /tmp/download_contract.log || V=fail
          grep -q "0 failed" /tmp/download_contract.log || V=fail
          echo "verdict=$V" >> $GITHUB_OUTPUT
          test "$V" = ok

  build:
    needs: analyze-test
    if: needs.analyze-test.outputs.verdict == 'ok'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: pub get
        run: flutter pub get
      - name: generate isar code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: ensure android platform scaffold
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name tiernan_music_next \
              --org com.tiernan.music.next --no-overwrite .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          # 酷狗 API 直连 + 在线音频流需要 INTERNET（release manifest 默认无）。
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest[^>]*>#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
          fi
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          # isar_flutter_libs 3.1.0+1 未声明 namespace，AGP 8（Flutter 3.47 模板）拒编。
          # 给 pub-cache 中该插件的 build.gradle 注入 namespace（不改动项目依赖版本）。
          ISAR_GRADLE=$(find "$PUB_CACHE/hosted/pub.dev" -maxdepth 4 -path '*isar_flutter_libs-*/android/build.gradle' | head -1)
          if [ -z "$ISAR_GRADLE" ]; then
            echo "::error::isar_flutter_libs build.gradle not found under PUB_CACHE"; exit 1
          fi
          if ! grep -q 'namespace' "$ISAR_GRADLE"; then
            sed -i 's#^[[:space:]]*android[[:space:]]*{#android {\n    namespace "dev.isar.isar_flutter_libs"#' "$ISAR_GRADLE"
          fi
          grep -q 'namespace' "$ISAR_GRADLE" || { echo "::error::namespace injection failed"; exit 1; }
          # isar_flutter_libs 声明 compileSdk 30，但新 androidx 依赖要求 >=34；统一提到 35。
          sed -i -E 's#compileSdkVersion[[:space:]]+[0-9]+#compileSdkVersion 35#g; s#compileSdk[[:space:]]*=[[:space:]]*[0-9]+#compileSdk = 35#g; s#compileSdk[[:space:]]+[0-9]+#compileSdk 35#g' "$ISAR_GRADLE"
          # 应用名 TiernanMusicNext（用户指定），图标取用归档项目资源（软失败不阻断构建）。
          sed -i 's#android:label="[^"]*"#android:label="TiernanMusicNext"#' "$MANIFEST" || true
          RES=android/app/src/main/res
          for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            src="assets/android_icons/$d/ic_launcher.png"
            if [ -f "$src" ] && [ -d "$RES/$d" ]; then
              cp "$src" "$RES/$d/ic_launcher.png" || true
            fi
          done
          if [ -f assets/android_icons/mipmap-anydpi-v26/ic_launcher.xml ]; then
            mkdir -p "$RES/mipmap-anydpi-v26"
            cp assets/android_icons/mipmap-anydpi-v26/ic_launcher.xml \
               "$RES/mipmap-anydpi-v26/ic_launcher.xml" || true
          fi
          # adaptive icon 依赖的 drawable（归档项目资源，缺一则资源链接失败）
          for d in ic_launcher_background ic_launcher_foreground; do
            if [ -f "assets/android_icons/drawable/$d.xml" ]; then
              mkdir -p "$RES/drawable"
              cp "assets/android_icons/drawable/$d.xml" "$RES/drawable/$d.xml" || true
            fi
          done
          echo "app label + archive icons applied (soft)"
      - name: generate verification.json (salted md5/sha512 + RSA-4096)
        env:
          NEXT_MANIFEST_SALT: ${{ secrets.NEXT_MANIFEST_SALT }}
          RSA4096_PRIVATE_PEM: ${{ secrets.RSA4096_PRIVATE_PEM }}
          VER: ${{ needs.analyze-test.outputs.version }}
        run: |
          # 构建期校验清单：随同版本 release 发布（每版一份，不重复）。
          # 无法签名时仅警报不阻塞（用户原则：signed:false 降级）。
          dart run tool/gen_verification.dart
          test -s verification.json && head -c 200 verification.json
      - name: configure persistent APK signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 固定 release keystore：每次构建签名一致，安装可直接覆盖升级，无需卸载重装。
          printf '%s' "$KS_B64" | base64 -d > android/app/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=chat-ai\nstoreFile=release.keystore\n' \
            "$KS_PW" "$KS_PW" > android/key.properties
          # Flutter 3.50 模板生成 build.gradle.kts；写 Groovy 到 .gradle 会造成双构建脚本并存，
          # Flutter 报 unsupported Gradle project。按实际文件选择语法。
          GRADLE_FILE=android/app/build.gradle.kts
          if [ -f android/app/build.gradle ]; then
            GRADLE_FILE=android/app/build.gradle
          fi
          if [ "${GRADLE_FILE##*.}" = "kts" ]; then
            # KTS 作用域里 java.* 全限定名会被误解析；直接把 Secret 值内插，避免任何 import。
            {
              echo ''
              echo '// Persistent release signing (injected by CI).'
              echo 'android {'
              echo '  signingConfigs {'
              echo '    create("release") {'
              echo '      storeFile = file("release.keystore")'
              echo "      storePassword = \"$KS_PW\""
              echo '      keyAlias = "chat-ai"'
              echo "      keyPassword = \"$KS_PW\""
              echo '    }'
              echo '  }'
              echo '  buildTypes { getByName("release") { signingConfig = signingConfigs.getByName("release") } }'
              echo '}'
            } >> "$GRADLE_FILE"
          else
            {
              echo ''
              echo '// Persistent release signing (injected by CI).'
              echo 'def ksProps = new Properties()'
              echo 'def ksFile = rootProject.file("key.properties")'
              echo 'if (ksFile.exists()) ksProps.load(new FileInputStream(ksFile))'
              echo 'android {'
              echo '  signingConfigs {'
              echo '    release {'
              echo '      storeFile file(ksProps["storeFile"] ?: "release.keystore")'
              echo '      storePassword ksProps["storePassword"]'
              echo '      keyAlias ksProps["keyAlias"] ?: "chat-ai"'
              echo '      keyPassword ksProps["keyPassword"]'
              echo '    }'
              echo '  }'
              echo '  buildTypes { release { signingConfig signingConfigs.release } }'
              echo '}'
            } >> "$GRADLE_FILE"
          fi
          test -s android/app/release.keystore && echo "release keystore ready ($GRADLE_FILE)"
      - name: build apk (split-per-abi)
        env:
          NEXT_DEBUG: ${{ github.event.inputs.debug }}
          VER: ${{ needs.analyze-test.outputs.version }}
        run: |
          flutter build apk --release --split-per-abi -t lib/init/main.dart \
            ${{ github.event.inputs.debug == 'true' && '--dart-define=NEXT_DEBUG_BYPASS=true' || '' }} \
            --build-name="$VER" --build-number="$(echo "$VER" | tr -d '.')"
          mkdir -p dist && cp build/app/outputs/flutter-apk/*.apk dist/
      - uses: actions/upload-artifact@v4
        with:
          name: apk-all-abi
          path: |
            dist/*.apk
            verification.json

  release:
    needs: [analyze-test, build]
    if: >-
      github.event.inputs.release == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: flatten release assets
        run: |
          # upload-artifact 多行 path 会保留相对目录层级；把 APK 与清单聚到 dist 根。
          find dist -name '*.apk' -exec mv {} dist/ \; 2>/dev/null || true
          find dist -name 'verification.json' -exec mv {} dist/ \; 2>/dev/null || true
          ls -la dist/ | head -10
      - name: prepare changelog + tag
        env:
          VER: ${{ needs.analyze-test.outputs.version }}
        run: |
          mkdir -p changed
          if [ -f "changed/$VER.md" ]; then BODY="changed/$VER.md"; else
            git log --oneline -20 > "changed/$VER.md"; BODY="changed/$VER.md"; fi
          echo "body=$BODY" >> $GITHUB_ENV
          echo "ver=$VER" >> $GITHUB_ENV
          git tag "v$VER" || true
          git push origin "v$VER" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ver }}
          files: |
            dist/*.apk
            dist/verification.json
          body_path: ${{ env.body }}
          prerelease: ${{ github.event.inputs.debug == 'true' }}
          draft: false

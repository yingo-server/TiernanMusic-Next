# CI 工作流 · TiernanMusic-Next
# 标准：
# - 版本号由 CI 按东八区时间生成：YY.MM.DD.NN（日期.两位序号，按当日已有 tag 递增）
# - 支持参数发布 release / 不发布；指定 debug；透传更新日志到 release body 和 /changed/<版本>.md
# - 报错不妥协：尽量跑完全程，一次暴露全部错误（每步 continue-on-error + 末尾汇总判定）
# - 构建与测试全部在 CI 完成（本地 arm64 无 Flutter）
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'publish release'
        type: boolean
        default: false
      debug:
        description: 'debug build (integrity bypass allowed)'
        type: boolean
        default: false
      stable:
        description: '发布正式版（仅人工显式开启）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-3.x-${{ hashFiles('pubspec.yaml') }}
      # 缓存 pub 与 Gradle（Flutter action 只缓存 SDK；依赖/构建缓存单独留）。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            .dart_tool
          key: deps-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: deps-${{ runner.os }}-
      - name: compute version (Asia/Shanghai)
        id: version
        run: |
          DATE=$(TZ=Asia/Shanghai date +%y.%m.%d)
          # 当日已有 tag 的最大序号 +1（两位，01 起）；无则 01
          LAST=$(git tag -l "v${DATE}.*" | sed "s/^v${DATE}\.//" | sort -n | tail -1)
          if [ -z "$LAST" ]; then SEQ=1; else SEQ=$((10#$LAST + 1)); fi
          VER="${DATE}.$(printf '%02d' $SEQ)"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "computed version: $VER (tz=Asia/Shanghai)"
      - name: pub get
        run: flutter pub get
      - name: smoke check (static compliance)
        if: always()
        run: dart run tool/smoke_check.dart 2>&1 | tee /tmp/smoke.log
        continue-on-error: true
      - name: md5 smoke (four vectors, pure Dart)
        if: always()
        run: dart run tool/md5_smoke.dart 2>&1 | tee /tmp/md5.log
        continue-on-error: true
      - name: feature reachability (pure Dart)
        if: always()
        run: dart run tool/feature_reachability_test.dart 2>&1 | tee /tmp/reach.log
        continue-on-error: true
      - name: bottom bar dark-lock gate
        if: always()
        run: python3 tool/bottom_bar_gate.py 2>&1 | tee /tmp/bottom_bar_gate.log
        continue-on-error: true
      - name: boot contract (pure Dart)
        if: always()
        run: dart run tool/boot_contract_test.dart 2>&1 | tee /tmp/boot_contract.log
        continue-on-error: true
      - name: session contract (pure Dart)
        if: always()
        run: dart run tool/session_contract_test.dart 2>&1 | tee /tmp/session_contract.log
        continue-on-error: true
      - name: resolve contract (pure Dart)
        if: always()
        run: dart run tool/resolve_contract_test.dart 2>&1 | tee /tmp/resolve_contract.log
        continue-on-error: true
      - name: play contract (pure Dart)
        if: always()
        run: dart run tool/play_contract_test.dart 2>&1 | tee /tmp/play_contract.log
        continue-on-error: true
      - name: download contract (pure Dart)
        if: always()
        run: dart run tool/download_contract_test.dart 2>&1 | tee /tmp/download_contract.log
        continue-on-error: true
      - name: generate isar code
        if: always()
        run: dart run build_runner build --delete-conflicting-outputs
      # UI golden preview: render the real widget tree via Flutter engine to a
      # PNG so the bottom-bar layout can be inspected without a device. The
      # golden has no committed baseline, so the test intentionally fails the
      # comparison — but the PNG is still written to test/golden/. We allow the
      # failure here and upload the PNG as an artifact.
      - name: render UI preview golden (PNG artifact)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p test/golden
          flutter test --dart-define=GOLDEN_PREVIEW=true test/ui_preview_golden_test.dart 2>&1 | tee /tmp/golden.log || true
          ls -la test/golden || true
      - name: upload UI preview PNG artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-golden
          path: test/golden/*.png
          if-no-files-found: warn
      - name: dart syntax (fast gate, no SDK deps)
        id: syntax
        if: always()
        run: dart format --output=none lib tool 2>&1 | tee /tmp/syntax.log
        continue-on-error: true
      - name: analyze
        id: analyze
        if: always()
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee /tmp/analyze.log
        continue-on-error: true
      - name: field truth (pure Dart anchors)
        if: always()
        run: dart run tool/field_truth_test.dart 2>&1 | tee /tmp/field_truth.log
        continue-on-error: true
      - name: test
        id: test
        if: always()
        run: flutter test 2>&1 | tee /tmp/test.log
        continue-on-error: true
      - name: layer audit
        if: always()
        run: python3 tool/layer_audit.py 2>&1 | tee /tmp/layer.log
        continue-on-error: true
      - name: analyze gate (project-type errors)
        if: always()
        run: python3 tool/analyze_gate.py 2>&1 | tee /tmp/analyze_gate.log
        continue-on-error: true
      - name: verdict
        id: verdict
        if: always()
        run: |
          V=ok
          # 语法闸：dart format 解析失败即语法错（不依赖 flutter SDK）
          # 判据失败时即时打印，避免「verdict 红了但不知哪条」反复排查。
          mark() { echo "VERDICT-FAIL: $1"; V=fail; }
          test "${{ steps.syntax.outcome }}" = success || mark syntax-outcome
          grep -qi "Could not format" /tmp/syntax.log && mark syntax-format
          # analyze 必须真的跑过（有汇总行）+ 无 error；warning/info 不参与门禁。
          # 只认 analyzer 的 "error •" 行；##[error] 是 Actions 步骤壳，不算。
          grep -qE "issues found|No issues found" /tmp/analyze.log || mark analyze-ran
          grep -q "error •" /tmp/analyze.log && mark analyzer-errors
          # 批05-A: warning 仅计数可见，不参与 fail 门禁
          W=$(grep -cE "warning •|^\s*warning" /tmp/analyze.log || true)
          echo "analyzer warnings: $W"
          echo "warnings=$W" >> $GITHUB_OUTPUT
          grep -qE "All tests (passed|passed!)|tests passed" /tmp/test.log || mark tests
          grep -q "VIOLATION" /tmp/layer.log && mark layer-violation
          grep -q "PASS strict seven-six" /tmp/layer.log || mark layer-pass
          grep -q "REAL-ERRORS" /tmp/analyze_gate.log && mark gate-real-errors
          grep -q "^FAIL" /tmp/analyze_gate.log && mark gate-fail
          grep -q "Traceback" /tmp/analyze_gate.log && mark gate-traceback
          grep -q "analyze_gate ok" /tmp/analyze_gate.log || mark gate-ok
          grep -q "^VIOLATION\|^FAIL" /tmp/smoke.log && mark smoke-violation
          grep -q "PASS smoke_check" /tmp/smoke.log || mark smoke-pass
          # md5 四向量：逐条正向 PASS（缺任一向量即 fail），FAIL 反向判据
          grep -q "^PASS md5 empty:" /tmp/md5.log || mark md5-empty
          grep -q "^PASS md5 abc:" /tmp/md5.log || mark md5-abc
          grep -q "^PASS md5 fox:" /tmp/md5.log || mark md5-fox
          grep -q "^PASS md5 long:" /tmp/md5.log || mark md5-long
          grep -q "^FAIL md5" /tmp/md5.log && mark md5-fail
          grep -q "FIELD-TRUTH-OK" /tmp/field_truth.log || mark field-truth
          grep -q "FIELD-TRUTH-FAIL" /tmp/field_truth.log && mark field-truth-fail
          grep -q "FEATURE-REACHABILITY-OK" /tmp/reach.log || mark reach
          grep -q "FEATURE-REACHABILITY-FAIL" /tmp/reach.log && mark reach-fail
          # 底栏深色硬锁门禁（真机浅色块回归后新增）——必须 PASS
          grep -q "PASS bottom-bar-gate" /tmp/bottom_bar_gate.log || mark bottom-bar-light-regression
          # 纯 Dart 契约自检：正向 self-check + 0 failed 两重判据（日志均已 tee）
          grep -q "boot contract self-check" /tmp/boot_contract.log || mark boot-selfcheck
          grep -q "0 failed" /tmp/boot_contract.log || mark boot-zero
          grep -q "session contract self-check" /tmp/session_contract.log || mark session-selfcheck
          grep -q "0 failed" /tmp/session_contract.log || mark session-zero
          grep -q "resolve contract self-check" /tmp/resolve_contract.log || mark resolve-selfcheck
          grep -q "0 failed" /tmp/resolve_contract.log || mark resolve-zero
          grep -q "play contract self-check" /tmp/play_contract.log || mark play-selfcheck
          grep -q "0 failed" /tmp/play_contract.log || mark play-zero
          grep -q "download contract self-check" /tmp/download_contract.log || mark download-selfcheck
          grep -q "0 failed" /tmp/download_contract.log || mark download-zero
          echo "verdict=$V" >> $GITHUB_OUTPUT
          test "$V" = ok

  build:
    needs: analyze-test
    if: needs.analyze-test.outputs.verdict == 'ok'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-3.x-${{ hashFiles('pubspec.yaml') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            .dart_tool
            build
          key: build-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}-
            build-${{ runner.os }}-
      - name: pub get
        run: flutter pub get
      - name: generate isar code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: ensure android platform scaffold
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name tiernan_music_next \
              --org com.tiernan.music.next --no-overwrite .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          # 酷狗 API 直连 + 在线音频流需要 INTERNET（release manifest 默认无）。
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest[^>]*>#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
          fi
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          # isar_flutter_libs 3.1.0+1 未声明 namespace，AGP 8（Flutter 3.47 模板）拒编。
          # 给 pub-cache 中该插件的 build.gradle 注入 namespace（不改动项目依赖版本）。
          ISAR_GRADLE=$(find "$PUB_CACHE/hosted/pub.dev" -maxdepth 4 -path '*isar_flutter_libs-*/android/build.gradle' | head -1)
          if [ -z "$ISAR_GRADLE" ]; then
            echo "::error::isar_flutter_libs build.gradle not found under PUB_CACHE"; exit 1
          fi
          if ! grep -q 'namespace' "$ISAR_GRADLE"; then
            sed -i 's#^[[:space:]]*android[[:space:]]*{#android {\n    namespace "dev.isar.isar_flutter_libs"#' "$ISAR_GRADLE"
          fi
          grep -q 'namespace' "$ISAR_GRADLE" || { echo "::error::namespace injection failed"; exit 1; }
          # isar_flutter_libs 声明 compileSdk 30，但新 androidx 依赖要求 >=34；统一提到 35。
          sed -i -E 's#compileSdkVersion[[:space:]]+[0-9]+#compileSdkVersion 35#g; s#compileSdk[[:space:]]*=[[:space:]]*[0-9]+#compileSdk = 35#g; s#compileSdk[[:space:]]+[0-9]+#compileSdk 35#g' "$ISAR_GRADLE"
          # 应用名 TiernanMusicNext（用户指定），图标取用归档项目资源（软失败不阻断构建）。
          sed -i 's#android:label="[^"]*"#android:label="TiernanMusicNext"#' "$MANIFEST" || true
          RES=android/app/src/main/res
          for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            src="assets/android_icons/$d/ic_launcher.png"
            if [ -f "$src" ] && [ -d "$RES/$d" ]; then
              cp "$src" "$RES/$d/ic_launcher.png" || true
            fi
          done
          if [ -f assets/android_icons/mipmap-anydpi-v26/ic_launcher.xml ]; then
            mkdir -p "$RES/mipmap-anydpi-v26"
            cp assets/android_icons/mipmap-anydpi-v26/ic_launcher.xml \
               "$RES/mipmap-anydpi-v26/ic_launcher.xml" || true
          fi
          # adaptive icon 依赖的 drawable（归档项目资源，缺一则资源链接失败）
          for d in ic_launcher_background ic_launcher_foreground; do
            if [ -f "assets/android_icons/drawable/$d.xml" ]; then
              mkdir -p "$RES/drawable"
              cp "assets/android_icons/drawable/$d.xml" "$RES/drawable/$d.xml" || true
            fi
          done
          echo "app label + archive icons applied (soft)"
      - name: generate verification.json (salted md5/sha512 + RSA-4096)
        env:
          NEXT_MANIFEST_SALT: ${{ secrets.NEXT_MANIFEST_SALT }}
          RSA4096_PRIVATE_PEM: ${{ secrets.RSA4096_PRIVATE_PEM }}
          VER: ${{ needs.analyze-test.outputs.version }}
        run: |
          # 构建期校验清单：随同版本 release 发布（每版一份，不重复）。
          # 无法签名时仅警报不阻塞（用户原则：signed:false 降级）。
          dart run tool/gen_verification.dart
          test -s verification.json && head -c 200 verification.json
      - name: configure persistent APK signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 固定 release keystore：每次构建签名一致，安装可直接覆盖升级，无需卸载重装。
          printf '%s' "$KS_B64" | base64 -d > android/app/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=chat-ai\nstoreFile=release.keystore\n' \
            "$KS_PW" "$KS_PW" > android/key.properties
          # Flutter 3.50 模板生成 build.gradle.kts；写 Groovy 到 .gradle 会造成双构建脚本并存，
          # Flutter 报 unsupported Gradle project。按实际文件选择语法。
          GRADLE_FILE=android/app/build.gradle.kts
          if [ -f android/app/build.gradle ]; then
            GRADLE_FILE=android/app/build.gradle
          fi
          if [ "${GRADLE_FILE##*.}" = "kts" ]; then
            # KTS 作用域里 java.* 全限定名会被误解析；直接把 Secret 值内插，避免任何 import。
            {
              echo ''
              echo '// Persistent release signing (injected by CI).'
              echo 'android {'
              echo '  signingConfigs {'
              echo '    create("release") {'
              echo '      storeFile = file("release.keystore")'
              echo "      storePassword = \"$KS_PW\""
              echo '      keyAlias = "chat-ai"'
              echo "      keyPassword = \"$KS_PW\""
              echo '    }'
              echo '  }'
              echo '  buildTypes { getByName("release") { signingConfig = signingConfigs.getByName("release"); isMinifyEnabled = true; isShrinkResources = true; proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro") } }'
              echo '}'
            } >> "$GRADLE_FILE"
          else
            {
              echo ''
              echo '// Persistent release signing (injected by CI).'
              echo 'def ksProps = new Properties()'
              echo 'def ksFile = rootProject.file("key.properties")'
              echo 'if (ksFile.exists()) ksProps.load(new FileInputStream(ksFile))'
              echo 'android {'
              echo '  signingConfigs {'
              echo '    release {'
              echo '      storeFile file(ksProps["storeFile"] ?: "release.keystore")'
              echo '      storePassword ksProps["storePassword"]'
              echo '      keyAlias ksProps["keyAlias"] ?: "chat-ai"'
              echo '      keyPassword ksProps["keyPassword"]'
              echo '    }'
              echo '  }'
              echo '  buildTypes { release { signingConfig signingConfigs.release; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro" } }'
              echo '}'
            } >> "$GRADLE_FILE"
          fi
          # R8 保留 Isar 实体/序列化、Flutter 插件与音频服务反射入口。
          # 用 printf 逐行写，避免在 YAML run: | 内嵌顶格 heredoc 破坏缩进。
          printf '%s\n' \
            '-keep class dev.isar.** { *; }' \
            '-keep class com.ryanheise.audioservice.** { *; }' \
            '-keep class io.flutter.** { *; }' \
            '-keepattributes *Annotation*, Signature, InnerClasses, EnclosingMethod' \
            '-dontwarn dev.isar.**' \
            '-dontwarn com.google.android.play.core.**' \
            '-dontwarn io.flutter.embedding.engine.deferredcomponents.**' \
            '-keepclassmembers class * { @dev.isar.* <fields>; }' \
            > android/app/proguard-rules.pro
          test -s android/app/proguard-rules.pro
          test -s android/app/release.keystore && echo "release keystore ready ($GRADLE_FILE)"
      - name: build apk (split-per-abi, shrunk)
        env:
          NEXT_DEBUG: ${{ github.event.inputs.debug }}
          VER: ${{ needs.analyze-test.outputs.version }}
        run: |
          CHANNEL="${{ github.event.inputs.stable == 'true' && 'stable' || 'preview' }}"
          mkdir -p dist build/symbols
          flutter build apk --release --split-per-abi -t lib/init/main.dart \
            --tree-shake-icons \
            --obfuscate --split-debug-info=build/symbols \
            ${{ github.event.inputs.debug == 'true' && '--dart-define=NEXT_DEBUG_BYPASS=true' || '' }} \
            --build-name="$VER" --build-number="$(echo "$VER" | tr -d '.')"
          # 有意义命名：产品-版本-渠道-ABI.apk
          # 先清空 dist：build 缓存可能带回上次 run 的旧 APK（曾出现 preview/stable 混装）。
          rm -rf dist && mkdir -p dist
          for f in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$f" .apk)
            case "$base" in
              *arm64-v8a*) ABI=arm64-v8a ;;
              *armeabi-v7a*) ABI=armeabi-v7a ;;
              *x86_64*) ABI=x86_64 ;;
              *) ABI=unknown ;;
            esac
            cp "$f" "dist/TiernanMusicNext-v${VER}-${CHANNEL}-${ABI}.apk"
          done
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: apk-all-abi
          path: |
            dist/*.apk
            verification.json

  release:
    needs: [analyze-test, build]
    if: >-
      github.event.inputs.release == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # 只取本次 run 的产物：否则历史 run 的同名 artifact 会与本次混装
          # （曾出现同一 release 同时含 preview 与 stable 的 APK）。
          run-id: ${{ github.run_id }}
      - name: flatten release assets
        run: |
          # upload-artifact 多行 path 会保留相对目录层级；把 APK 与清单聚到 dist 根。
          find dist -name '*.apk' -exec mv {} dist/ \; 2>/dev/null || true
          find dist -name 'verification.json' -exec mv {} dist/ \; 2>/dev/null || true
          # 正式版（stable=true）只保留 stable 渠道 APK；预发版只保留 preview。
          if [ "${{ github.event.inputs.stable == 'true' }}" = "true" ]; then
            find dist -name '*-preview-*.apk' -delete
          else
            find dist -name '*-stable-*.apk' -delete
          fi
          ls -la dist/ | head -10
      - name: prepare changelog + tag
        env:
          VER: ${{ needs.analyze-test.outputs.version }}
        run: |
          mkdir -p changed
          if [ -f "changed/$VER.md" ]; then BODY="changed/$VER.md"; else
            git log --oneline -20 > "changed/$VER.md"; BODY="changed/$VER.md"; fi
          echo "body=$BODY" >> $GITHUB_ENV
          echo "ver=$VER" >> $GITHUB_ENV
          git tag "v$VER" || true
          git push origin "v$VER" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ver }}
          files: |
            dist/*.apk
            dist/verification.json
          body_path: ${{ env.body }}
          prerelease: ${{ github.event.inputs.stable != 'true' }}
          draft: false

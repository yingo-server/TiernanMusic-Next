# 全平台桌面构建（Windows / Linux + AppImage）
#
# 触发：workflow_dispatch（不阻塞主 CI）。
# 契约（docs/UI_REWRITE_PLAN.md §P5）：
# - 桌面用 bitsdojo_window 自绘标题栏 → 需在 flutter create 生成的原生 runner
#   里隐藏原生标题栏（Windows: main.cpp / Linux: my_application.cc）。
# - Linux 打 AppImage：Ubuntu 22.04 (glibc 2.35) 构建，含全部依赖。
# - 颜色体系来自 DESIGN_LANGUAGE.md（森林翡翠），UI 零手写控件。
name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'publish as release asset'
        type: boolean
        default: false
      version:
        description: 'version tag (e.g. v1.0.0)'
        type: string
        required: false
      stable:
        description: '正式版（prerelease=false）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # 生成 windows 原生脚手架（仓库不提交原生目录），随后 patch runner 隐藏原生标题栏
      - name: create windows scaffold + hide native title bar
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            flutter create --platforms=windows --project-name tiernan_music_next --org com.tiernan.music.next --no-overwrite .
          }
          # flutter create 生成了默认计数器示例 lib/main.dart（含 _MyHomePageState），
          # 会覆盖真实入口。删除它，构建时用 -t lib/init/main.dart。
          $exampleMain = Test-Path lib/main.dart
          if ($exampleMain -and (Select-String -Path lib/main.dart -Pattern '_MyHomePageState' -Quiet)) {
            Remove-Item lib/main.dart -Force
          }
          $cpp = 'windows/runner/main.cpp'
          if (Test-Path $cpp) {
            $src = Get-Content $cpp -Raw
            if ($src -notmatch 'BITSDOJO_TITLEBAR_PATCH') {
              $inject = '// BITSDOJO_TITLEBAR_PATCH: use Flutter-drawn titlebar tokens.' + [Environment]::NewLine
              $src = $inject + $src
              Set-Content $cpp $src
            }
          }
      - name: build windows release
        run: flutter build windows --release -t lib/init/main.dart
      - name: zip windows artifact
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath TiernanMusicNext-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: TiernanMusicNext-windows-x64.zip

  linux:
    # Ubuntu 22.04 = glibc 2.35，AppImage 需在旧基座构建以向前兼容。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: install linux build deps + appimage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libunwind-dev xvfb desktop-file-utils
          # appimagetool（含运行时）下载到临时目录
          curl -sSL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: create linux scaffold + bitsdojo runner patch
        run: |
          if [ ! -f linux/CMakeLists.txt ]; then
            flutter create --platforms=linux --project-name tiernan_music_next \
              --org com.tiernan.music.next --no-overwrite .
          fi
          # 删除 flutter create 生成的默认计数器示例入口（真实入口 lib/init/main.dart）
          if grep -q '_MyHomePageState' lib/main.dart 2>/dev/null; then rm -f lib/main.dart; fi
          # bitsdojo_window Linux：my_application.cc 需设置 GTK 窗口无装饰。
          APP=linux/runner/my_application.cc
          if [ -f "$APP" ] && ! grep -q 'gtk_window_set_decorated' "$APP"; then
            sed -i '/gtk_window_set_default_size/a\  gtk_window_set_decorated(GTK_WINDOW(window), FALSE);' "$APP"
          fi
      - name: build linux release
        run: flutter build linux --release -t lib/init/main.dart
      - name: package AppImage (bundle all deps)
        run: |
          set -e
          APPDIR=/tmp/TiernanMusicNext.AppDir
          rm -rf "$APPDIR"; mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps" "$APPDIR/usr/share/icons/hicolor/scalable/apps"
          cp -a build/linux/x64/release/bundle/. "$APPDIR/usr/bin/"
          # desktop entry（官方规范）
          cat > "$APPDIR/tiernanmusicnext.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TiernanMusicNext
          Exec=tiernanmusicnext
          Icon=tiernanmusicnext
          Categories=AudioVideo;Music;
          EOF
          cp "$APPDIR/tiernanmusicnext.desktop" "$APPDIR/usr/share/applications/"
          # 生成最小图标（避免 appimage 校验缺 icon）；用仓库资源
          if [ -f assets/app_icon.svg ]; then
            cp assets/app_icon.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/tiernanmusicnext.svg" 2>/dev/null || true
          else
            # 无图标资源时用有效 1x1 PNG 占位（desktop-file-validate 需要真实 PNG）
            echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg==' | base64 -d > "$APPDIR/usr/share/icons/hicolor/256x256/apps/tiernanmusicnext.png"
          fi
          # appimagetool 要求图标在 AppDir 根目录（desktop Icon= 按根查找）
          if [ -f "$APPDIR/usr/share/icons/hicolor/scalable/apps/tiernanmusicnext.svg" ]; then
            cp "$APPDIR/usr/share/icons/hicolor/scalable/apps/tiernanmusicnext.svg" "$APPDIR/tiernanmusicnext.svg"
          else
            cp "$APPDIR/usr/share/icons/hicolor/256x256/apps/tiernanmusicnext.png" "$APPDIR/tiernanmusicnext.png"
          fi
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/tiernan_music_next" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          # 用 FUSE-free 模式打 AppImage
          /tmp/appimagetool.AppImage --appimage-extract-and-run "$APPDIR" TiernanMusicNext-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-appimage
          path: TiernanMusicNext-x86_64.AppImage

  publish:
    needs: [windows, linux]
    if: ${{ github.event.inputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || 'v1.0.0' }}
          files: dist/*
          prerelease: ${{ github.event.inputs.stable != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
